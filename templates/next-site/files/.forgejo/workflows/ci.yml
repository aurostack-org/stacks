name: CI

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!development'
  pull_request:

jobs:
  verify:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Format check
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      # No database needed: storefront pages render per request.
      - name: Build
        run: yarn build
        env:
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
