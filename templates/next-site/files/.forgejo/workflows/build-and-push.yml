# Builds and pushes the site image.
#
# NEXT_PUBLIC_* values are compiled into the build, so this image is specific
# to one public URL — see the note at the top of the Dockerfile.

name: Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: |
          DATE=$(date +'%y_%m_%d')
          RAND=$(printf '%05d' "$((RANDOM % 100000))")
          echo "TAG=${DATE}_${RAND}" >> "$GITHUB_OUTPUT"
          echo "OWNER=$(echo '${{ github.repository }}' | cut -d/ -f1)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.DK_USER }}
          password: ${{ secrets.DK_ACCESS_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          build-args: |
            NEXT_PUBLIC_SERVER_URL=${{ secrets.NEXT_PUBLIC_SERVER_URL }}
            NEXT_PUBLIC_OPENOBSERVE_URL=${{ secrets.NEXT_PUBLIC_OPENOBSERVE_URL }} # @feature telemetry
            NEXT_PUBLIC_OPENOBSERVE_ORG=${{ secrets.NEXT_PUBLIC_OPENOBSERVE_ORG }} # @feature telemetry
            NEXT_PUBLIC_OPENOBSERVE_CLIENT_TOKEN=${{ secrets.NEXT_PUBLIC_OPENOBSERVE_CLIENT_TOKEN }} # @feature telemetry
          tags: |
            ${{ secrets.REGISTRY }}/${{ steps.tag.outputs.OWNER }}/site:latest
            ${{ secrets.REGISTRY }}/${{ steps.tag.outputs.OWNER }}/site:${{ steps.tag.outputs.TAG }}

      - name: Summary
        run: echo "Pushed site:${{ steps.tag.outputs.TAG }}" >> "$GITHUB_STEP_SUMMARY"
