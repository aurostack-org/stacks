name: acme
services:
  # Blocks until Postgres and Redis actually accept connections — `docker
  # compose up -d` returns long before that, and every "connection refused" on
  # a fresh machine traces back to skipping this. Driven by `yarn dc:wait`.
  wait:
    container_name: acme-wait
    image: ufoscout/docker-compose-wait:latest
    command: sh -c '/wait && exit'
    environment:
      # List form, not a mapping: two `WAIT_HOSTS` mapping keys would be a
      # duplicate-key error, whereas list entries are just strings and Compose
      # takes the last one. The cache variant is therefore listed second.
      - WAIT_HOSTS=database:5432 # @feature !cache
      - WAIT_HOSTS=database:5432,redis:6379 # @feature cache
      - WAIT_TIMEOUT=300
  database:
    container_name: acme-database
    image: postgres:15.3
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main
    volumes:
      - database:/var/lib/postgresql/data
  # @feature:start cache
  redis:
    container_name: acme-redis
    image: redis:7.4.1
    restart: always
    ports:
      - 6379:6379
  # @feature:end
  # @feature:start temporal
  # Temporal's development server (the CLI's `server start-dev`): gRPC on 7233,
  # Web UI on http://localhost:8233, state kept in the temporal volume.
  temporal:
    container_name: acme-temporal
    image: temporalio/temporal:1.9.1
    restart: always
    command: server start-dev --ip 0.0.0.0 --db-filename /home/temporal/temporal.db
    ports:
      - 7233:7233
      - 8233:8233
    volumes:
      # The image runs as `temporal`; mounting its home keeps the volume writable.
      - temporal:/home/temporal
  # @feature:end

volumes:
  database:
  temporal: # @feature temporal
