<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="%THEME_LIGHT%" />
		<!--
			Applies the saved (or system) theme before first paint, so the app never
			flashes light then flips to dark. Mirrors `themeInitScript` in
			src/shared/ui — inlined because it must run before any module loads. Keep
			the two in sync. %THEME_LIGHT/DARK% come from THEME_COLORS via vite.config.
		-->
		<script>
			(function () {
				try {
					var m = localStorage.getItem('inerds-theme');
					var d =
						m === 'dark' || ((m === null || m === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
					var r = document.documentElement;
					r.classList.toggle('dark', d);
					r.style.colorScheme = d ? 'dark' : 'light';
					var t = document.querySelector('meta[name="theme-color"]');
					if (t) t.setAttribute('content', d ? '%THEME_DARK%' : '%THEME_LIGHT%');
				} catch (e) {}
			})();
		</script>
		<!--
			globals.css only styles `body`, so without this the UA canvas paints white
			for the moment before the stylesheet lands — a white flash on a dark load.
		-->
		<style>
			html {
				background: %THEME_LIGHT%;
			}
			html.dark {
				background: %THEME_DARK%;
			}
		</style>
		<meta name="description" content="Investment Nerds." />
		<!--
			Every route this app serves is private, so nothing here should be indexed.
			`robots.txt` only discourages crawling, while `noindex` prevents listing,
			so both belong in a deployment. This app's routes include password-reset
			and email-verify URLs.

			With the marketing site included this tag goes away: indexing is then
			decided per route by `PageMeta`, and the build emits a `noindex` of its own
			on any non-production origin. See vite.config.ts.
		-->
		<meta name="robots" content="noindex, nofollow" /> <!-- @feature !marketing -->
		<title>%APP_TITLE%</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
