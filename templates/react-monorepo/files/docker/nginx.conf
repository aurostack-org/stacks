# Static host for a built Vite SPA. One config serves every app in the repo —
# the Dockerfile copies it into whichever image it is building.
#
# The cache rules are load-bearing, not cosmetic: get them wrong and returning
# users are pinned to a stale build. Rule of thumb — anything with a content
# hash in its name is immutable forever; anything with a stable name must be
# revalidated every time.

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Compose/orchestrator health probe. Must not be logged or it floods access.log.
	location = /healthz {
		access_log off;
		add_header Content-Type text/plain;
		return 200 "ok\n";
	}

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_proxied any;
	gzip_types text/plain text/css application/javascript application/json
	           image/svg+xml application/manifest+json;

	# Vite emits content-hashed filenames here, so the content can never change
	# under a given URL — safe to cache for a year.
	# NB: no `expires` directive. `expires` emits its own Cache-Control, so
	# combining it with add_header sends the header twice and clients disagree on
	# which wins — `immutable` can be dropped. One explicit header instead.
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	# The service worker and its Workbox runtime keep STABLE names across builds.
	# If these are cached the browser keeps running the old worker, which keeps
	# serving the old precached app shell — users get stuck on a previous version
	# with no way out but a hard reload. Only a PWA build ships them; the rule is
	# harmless in the images that don't.
	location ~* ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
		add_header Cache-Control "no-cache, must-revalidate" always;
		expires off;
		try_files $uri =404;
	}

	# Re-checked on every load so a deploy is picked up immediately, and so the
	# manifest's start_url/icons stay in step with the installed PWA.
	location ~* ^/(manifest\.webmanifest|manifest\.json)$ {
		add_header Cache-Control "no-cache, must-revalidate" always;
		expires off;
		try_files $uri =404;
	}

	# Long-lived but not immutable: stable names, so they must stay revalidatable,
	# but they rarely change.
	location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
		add_header Cache-Control "public, max-age=604800" always;
		try_files $uri =404;
	}

	# SPA fallback. index.html is never cached — it references the hashed bundles,
	# so a cached copy would keep pointing at assets from the previous deploy.
	#
	# `$uri/index.html` comes BEFORE `$uri/` deliberately. If you add a prerender
	# pass that emits `about/index.html`, matching `$uri/` on a directory makes
	# nginx 301 to the trailing-slash form — verified: `/about` redirected to
	# `/about/`. That fights the canonical tag and the sitemap, which both use the
	# slashless `/about`, and adds a hop for every crawler. Serving the file
	# directly returns 200 at the canonical URL. Harmless for a pure SPA: it ships
	# no such directories, so the extra probe never matches.
	location / {
		try_files $uri $uri/index.html $uri/ @fallback;
		add_header Cache-Control "no-cache, must-revalidate" always;
		expires off;
	}

	# What an unknown path gets — and it has to differ per app, so it is decided
	# by what the image actually contains rather than by a second config file the
	# cache rules above would have to be duplicated into.
	#
	# A prerendered marketing site should emit `404.html` and answer 404. Without
	# one it falls through to `index.html`, and if that is a fully prerendered
	# homepage then every typo'd or stale URL returns 200 with a complete copy of
	# `/` that canonicalises to `/`. A soft 404 with a body is worse than one
	# without: there is something for a crawler to index.
	#
	# A pure SPA ships no `404.html` and keeps the index.html fallback. Every route
	# it owns is resolved client-side, so answering 404 would break the app rather
	# than describe it.
	#
	# `if` is limited here to `return` and `rewrite ... last`, the two directives
	# documented as safe inside a location.
	location @fallback {
		error_page 404 /404.html;
		if (-f $document_root/404.html) {
			return 404;
		}
		rewrite ^ /index.html last;
	}

	# Reachable only through error_page, so the page cannot also be served as a
	# regular 200 at /404.html and be indexed on its own.
	location = /404.html {
		internal;
		add_header Cache-Control "no-cache, must-revalidate" always;
		expires off;
	}

	# Modest hardening. Deliberately NO Content-Security-Policy header: the apps
	# ship an inline <script> in index.html that applies the saved theme before
	# first paint, and a default CSP without 'unsafe-inline' would block it and
	# reintroduce the light-mode flash. Add CSP only with a nonce/hash for that
	# script. HSTS belongs on the TLS-terminating proxy in front of this, not here.
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header X-Frame-Options "SAMEORIGIN" always;

	# RFC 9116 puts security.txt under /.well-known/, which the deny below would
	# otherwise 403 — that is the whole point of this block. `^~` is what makes the
	# exception stick: it tells nginx that once this prefix matches, regex
	# locations are skipped entirely, so `location ~ /\.` never gets a look at it.
	# Deliberately adds no headers of its own, because `add_header` in a location
	# REPLACES the inherited set rather than extending it — the server-level
	# hardening headers above would silently stop applying here.
	location ^~ /.well-known/ {
		try_files $uri =404;
	}

	location ~ /\. {
		deny all;
	}
}
